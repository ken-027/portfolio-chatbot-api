name: Deploy to Vercel

on:
  push:
    branches:
      - dev # Or your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v3

      - name: 🧱 Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Build app
        run: npm run build

      - name: 🔗 Link project to Vercel
        run: vercel link --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Print vercel linked
        run: cat ./vercel/project.json

      - name: 🚀 Deploy to Vercel
        run: vercel --token ${{ secrets.VERCEL_TOKEN }} --prod --yes
